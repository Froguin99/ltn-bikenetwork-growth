name: CI

on: [push, pull_request]

jobs:
  test-env:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v3

      # Set up Miniconda with Mamba to speed up environment solving
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: 3.12
          miniforge-variant: Mambaforge
          miniforge-version: 23.3.1-1
          architecture: x64
          activate-environment: base
          auto-update-conda: true

      # Install Calkit
      - run: pip install calkit-python

      # Quick test that some key packages import correctly
      - run: calkit xenv -n main -- python -c "import geopandas, rasterio, osmnx"
        shell: bash -l {0}
